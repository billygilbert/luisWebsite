		<script type="text/javascript">
			var gallerySections = [
				{ title: 'Company - SJSU 2025', folder: 'company', count: 8 },
				{ title: 'Show #2', folder: 'show2', count: 7 }
			];

			$(document).ready(function() {
				var container = $('#fancy');

				$.each(gallerySections, function(i, section) {
					var group = 'gallery_group_' + i;
					var p = $('<p>').css('margin-bottom', '5px').css('margin-top', '5px');

					for (var j = 1; j <= section.count; j++) {
						var img = $('<img>').attr({
							src: 'images/directing_page/' + section.folder + '/' + j + '.png',
							width: 90,
							height: 90
						}).css('margin-right', '5px');
						if (j === section.count) img.addClass('last').css('margin-right', '0');

						$('<a>').attr({
							rel: group,
							href: 'images/directing_page/' + section.folder + '/' + j + '.png',
							title: section.title
						}).append(img).appendTo(p);
					}

					p.append('<br />');

					var header = $('<h3>').css('text-align', 'center').text(section.title).addClass('directingTitle');
					var fancyDiv = $('<div align="center">').append(p);
					$('<div class="gallery-section">').append(header).append(fancyDiv).appendTo(container);
				});

				$('a[rel^="gallery_group_"]').fancybox({
					'transitionIn'  : 'none',
					'transitionOut' : 'none',
					'titlePosition' : 'over',
					'titleFormat'   : function(title, currentArray, currentIndex, currentOpts) {
						return '<span id="fancybox-title-over">Image ' + (currentIndex + 1) + ' / ' + currentArray.length + (title.length ? ' &nbsp; ' + title : '') + '</span>';
					}
				});
			});
		</script>
